[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-music"
version = "0.1.0"
description = "Executable textbook experiments for music, software, and sound"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
tech-music-waveform = "tech_music.waveform:main"
tech-music-inspect = "tech_music.digital_audio:main"
tech-music = "tech_music.app:main"
tech-music-system = "tech_music.system:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
